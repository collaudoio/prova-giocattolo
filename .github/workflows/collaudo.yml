# Il workflow di Collaudo nel repository del cliente: RICHIAMA il workflow fidato di Collaudo (C-0049),
# e il servizio dà ordini solo a quello (claim `job_workflow_ref`). Su `push`, mai su `pull_request`
# (C-0034: il commit che il token OIDC certifica è il commit consegnato); `workflow_dispatch` per la
# prova rossa sul commit base. Due soli permessi: leggere il codice e chiedere l'identità del workflow.
# Nessun segreto: l'identità è il token OIDC. Il contratto lo trova il servizio dal repository; si apre
# spingendo `.collaudo/contratto.json` sul ramo principale (la beta, C-0053).
name: collaudo

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  collaudo:
    uses: collaudoio/azione/.github/workflows/collaudo.yml@v1
